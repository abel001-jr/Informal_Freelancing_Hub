<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Copy service link - FreelanceHub</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fcf9f4; }
    main { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 32px; }
    h1 { color: #59336d; font: 600 16px Arial, sans-serif; margin: 0 0 24px; }
    .button-slot { min-height: 44px; display: flex; align-items: center; }
  .copy-button {
    background-color: #f6f0e6;
    color: #59336d;
    width: 100px;
    height: 30px;
    border: none;
    border-radius: 10px;
    font-family: Arial, sans-serif;
    font-weight: 600;
    cursor: pointer;
    overflow: hidden;
    position: relative;
    transition-duration: 700ms;
  }
  .copy-button span {
    position: absolute;
    top: 50%;
    left: 50%;
    white-space: nowrap;
  }
  .copy-button span:first-child {
    color: #59336d;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transform: translate(-50%, -50%);
    transition: transform 500ms, opacity 500ms;
  }
  .copy-button svg { width: 12px; height: 12px; flex-shrink: 0; }
  .copy-button span:last-child {
    color: #ffffff;
    opacity: 0;
    transform: translate(-50%, 100%);
    height: 14px;
    line-height: 13px;
    transition: transform 500ms, opacity 500ms;
  }
  .copy-button[data-copied="true"] {
    background-color: #59336d;
    width: 120px;
    height: 40px;
    transition-delay: 100ms;
    transition-duration: 500ms;
  }
  .copy-button[data-copied="true"] span:first-child {
    transform: translate(-50%, -150%);
    opacity: 0;
  }
  .copy-button[data-copied="true"] span:last-child {
    transform: translate(-50%, -50%);
    opacity: 1;
    transition-delay: 300ms;
  }
  .copy-button:focus-visible { outline: 2px solid #59336d; outline-offset: 4px; }
  .copy-button:disabled { cursor: wait; }
  .copy-status { margin: 12px 0 0; min-height: 2.5em; max-width: 260px; color: #76513e; font: 13px/1.5 Arial, sans-serif; }
  @media (prefers-reduced-motion: reduce) {
    .copy-button, .copy-button span { transition: none !important; }
  }
  </style>
</head>
<body>
  <main>
    <h1>Share a service</h1>
    <div class="button-slot">
      <button type="button" class="copy-button" data-copied="false" aria-label="Copy service link">
        <span aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" focusable="false">
            <rect x="8" y="8" width="13" height="13" rx="2" />
            <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" />
          </svg>Copy link
        </span>
        <span aria-hidden="true">Copied</span>
      </button>
    </div>
    <p class="copy-status" role="status">Copy a service link to share it.</p>
  </main>
  <script>
    const button = document.querySelector('.copy-button');
    const status = document.querySelector('.copy-status');
    let timer;
    button.addEventListener('click', async () => {
      clearTimeout(timer);
      button.dataset.copied = 'false';
      button.disabled = true;
      button.setAttribute('aria-busy', 'true');
      try {
        // Preview copies this page URL. In the app, supply the public service URL.
        await navigator.clipboard.writeText(window.location.href);
        button.dataset.copied = 'true';
        status.textContent = 'Link copied. Ready to share.';
        timer = setTimeout(() => {
          button.dataset.copied = 'false';
          status.textContent = 'Copy a service link to share it.';
        }, 2400);
      } catch {
        status.textContent = 'Could not copy. Copy the link from your address bar.';
      } finally {
        button.disabled = false;
        button.setAttribute('aria-busy', 'false');
      }
    });
  </script>
</body>
</html>
