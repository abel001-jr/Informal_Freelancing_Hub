<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login and logout buttons ? FreelanceHub</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f0e6; font-family: Arial, sans-serif; }
    main { display: flex; flex-wrap: wrap; justify-content: center; gap: 48px; padding: 32px; }
    section { width: 150px; }
    h2 { margin: 0 0 24px; color: #76513e; font-size: 14px; font-weight: 400; }
  .Btn {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition-duration: .3s;
    box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.199);
    background-color: #59336d;
    font-family: Arial, sans-serif;
    font-size: 16px;
    padding: 0;
    flex-shrink: 0;
  }

  .sign {
    width: 45px;
    flex: 0 0 45px;
    transition-duration: .3s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sign svg { width: 17px; height: 17px; flex-shrink: 0; }
  .sign svg path { fill: white; }

  .text {
    position: absolute;
    left: 45px;
    right: 10px;
    overflow: hidden;
    text-align: left;
    transform: translateX(8px);
    opacity: 0;
    color: white;
    font-size: 1.2em;
    font-weight: 600;
    transition-duration: .3s;
    white-space: nowrap;
  }

  .Btn:is(:hover, :focus-visible):not(:disabled) {
    width: var(--expanded-width, 125px);
    border-radius: 40px;
    transition-duration: .3s;
  }

  .Btn:is(:hover, :focus-visible):not(:disabled) .text {
    opacity: 1;
    transform: translateX(0);
    transition-duration: .3s;
  }

  .Btn:active:not(:disabled) { transform: translate(2px, 2px); }
  .Btn:focus-visible { outline: 2px solid #59336d; outline-offset: 4px; }
  .Btn:disabled { background-color: #b9b0aa; cursor: not-allowed; box-shadow: none; }
  .Btn:disabled .sign svg path { fill: #29252b; }
  @media (prefers-reduced-motion: reduce) {
    .Btn, .sign, .text { transition-duration: 0s !important; }
    .Btn:active:not(:disabled) { transform: none; }
  }
  </style>
</head>
<body>
  <main>
    <section><h2>Login</h2><button type="button" class="Btn" aria-label="Login">
      <span class="sign" aria-hidden="true"><svg viewBox="0 0 512 512" focusable="false"><path d="M352 96h64c17.7 0 32 14.3 32 32v256c0 17.7-14.3 32-32 32h-64c-17.7 0-32 14.3-32 32s14.3 32 32 32h64c53 0 96-43 96-96V128c0-53-43-96-96-96h-64c-17.7 0-32 14.3-32 32s14.3 32 32 32zM233.4 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l73.4 73.3H32c-17.7 0-32 14.3-32 32s14.3 32 32 32h229.5l-73.4 73.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l128-128c12.5-12.5 12.5-32.8 0-45.3l-128-128z" /></svg></span>
      <span class="text" aria-hidden="true">Login</span>
    </button></section>
    <section><h2>Logout</h2><button type="button" class="Btn" aria-label="Logout">
      <span class="sign" aria-hidden="true"><svg viewBox="0 0 512 512" focusable="false"><path d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z" /></svg></span>
      <span class="text" aria-hidden="true">Logout</span>
    </button></section>
  </main>
</body>
</html>
